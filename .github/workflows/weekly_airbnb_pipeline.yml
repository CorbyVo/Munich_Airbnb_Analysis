name: Weekly Munich Airbnb Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0 * * 0"
      timezone: "Europe/Berlin"

permissions:
  contents: write

jobs:
  run-airbnb-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Munich Airbnb pipeline
        run: |
          python scripts/run_pipeline.py --force-download

      - name: Update Google Sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/update_google_sheets.py

      - name: Show generated changes
        run: |
          git status --short

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md results/ images/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update generated Airbnb analysis outputs"
            git push
          fi